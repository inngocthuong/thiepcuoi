  <!--1. PHẦN 1 CSS thay thế (Dán vào thẻ <style> thay cho CSS của .gate-door và .gate-content)


    /* --- BÌA THIỆP DỰ PHÒNG: PHONG CÁCH CÀNH TRÚC RỦ & TÊN DỊCH XUỐNG --- */
    .gate-door {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      background: linear-gradient(165deg, #fcf6e8 0%, #f3e4c3 55%, #e8d0a0 100%);
      transition: transform 1.25s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: 1;
      box-shadow: inset 0 0 45px rgba(168, 124, 38, 0.2);
    }
    .gate-door-left { left: 0; border-right: 1px solid rgba(184, 137, 40, 0.65); }
    .gate-door-right { right: 0; border-left: 1px solid rgba(184, 137, 40, 0.65); }
    .gate-overlay.opening .gate-door-left { transform: translateX(-102%); }
    .gate-overlay.opening .gate-door-right { transform: translateX(102%); }

    /* Viền khung chỉ mảnh bên trong 2 cánh */
    .gate-door::before {
      content: "";
      position: absolute;
      top: 14px;
      bottom: 14px;
      width: calc(100% - 14px);
      border: 1px solid rgba(184, 137, 40, 0.42);
      pointer-events: none;
    }
    .gate-door-left::before { left: 14px; border-right: none; }
    .gate-door-right::before { right: 14px; border-left: none; }

    .gate-bamboo-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Dịch cụm tên dâu rể xuống (padding-top tăng từ 60px lên 135px) */
    .gate-content {
      position: relative;
      z-index: 3;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 135px 24px 56px;
      text-align: center;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .gate-overlay.opening .gate-content { opacity: 0; transform: scale(0.95); }

    .gate-top .sub {
      font-family: var(--font-serif);
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 11px;
      color: var(--gold-dark);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .gate-top .sub::before, .gate-top .sub::after { content: "✦"; font-size: 9px; color: var(--gold); }
    .gate-top h2 {
      font-family: var(--font-script);
      font-size: 48px;
      font-weight: 400;
      color: var(--ink-main);
      line-height: 1.05;
      text-shadow: 0 2px 14px rgba(212, 175, 55, 0.35);
    }
    .gate-top .amp {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 22px;
      color: var(--gold);
      margin: 2px 0;
    }
    .gate-top .date-pill {
      margin-top: 10px;
      font-family: var(--font-serif);
      font-size: 15px;
      letter-spacing: 4px;
      color: var(--gold-dark);
      font-weight: 600;
    }

    /* Thu gọn nhẹ nút ấn xuống 104px để cân đối khoảng cách mới */
    .star-seal-btn {
      width: 104px;
      height: 104px;
      margin: 8px 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff6dc, #e5c068 70%, #b88928 100%);
      border: 2px solid #fff9ea;
      box-shadow: 0 8px 28px rgba(184, 137, 40, 0.45), inset 0 0 18px rgba(255, 255, 255, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      animation: starPulse 2.4s infinite ease-in-out;
      transition: transform 0.3s ease;
    }
    .star-seal-btn:hover { transform: scale(1.06); }
    .star-seal-btn span.icon { font-size: 26px; color: #543a0c; line-height: 1; text-shadow: 0 0 10px rgba(255, 255, 255, 0.9); }
    .star-seal-btn span.tap-txt { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: #473008; font-weight: 600; margin-top: 5px; }
